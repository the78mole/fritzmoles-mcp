[project]
name = "fritzmoles-mcp"
version = "0.1.0"
description = "MCP server for the telephony features of a FRITZ!Box: call lists, answering machine, call barring and call forwarding via TR-064"
authors = [
    { name = "Daniel Glaser", email = "me@the78mole.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "fritzbox", "fritz!box", "tr-064", "telephony", "answering-machine", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "mcp[cli]>=2,<3",
    "fritzconnection>=1.15,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
]

[project.scripts]
fritzmoles-mcp = "fritzmoles_mcp.server:main"

[project.urls]
Homepage = "https://github.com/the78mole/fritzmoles-mcp"
Repository = "https://github.com/the78mole/fritzmoles-mcp"
Issues = "https://github.com/the78mole/fritzmoles-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fritzmoles_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=fritzmoles_mcp --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["fritzmoles_mcp"]
